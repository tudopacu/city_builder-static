events {
    # This block can be empty or contain specific directives
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Map allowed origins to a variable
    map $http_origin $cors_allowed {
        default 0;
        "http://citybuilder.home.ro:8080" 1;
        "http://citybuilder.home.ro:8082" 1;
        "http://citybuilder.home.ro:8083" 1;
        "http://localhost:8080" 1;
        "http://localhost:8082" 1;
        "http://localhost:8083" 1;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Direct nested routing for folder structures
        location / {
            try_files $uri $uri/ =404;

            # Enable CORS for specific origins
            if ($cors_allowed) {
                add_header 'Access-Control-Allow-Origin' "$http_origin" always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
            }
        }
    }
}